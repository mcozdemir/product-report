<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWT — 2026 Quarterly Report</title>
  <style>
    :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232635;--border:#2e3347;--text:#e2e8f0;--text-muted:#8892a4;--green:#22c55e;--blue:#3b82f6;--yellow:#f59e0b;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
    .header{background:linear-gradient(135deg,#1e2035,#252840);padding:32px 40px;border-bottom:1px solid var(--border);}
    .header h1{font-size:22px;font-weight:700;letter-spacing:2px;}
    .header .subtitle,.header .meta{color:var(--text-muted);font-size:13px;margin-top:4px;}
    .tabs{display:flex;gap:4px;padding:16px 40px 0;background:var(--surface);border-bottom:1px solid var(--border);}
    .tab{padding:10px 24px;cursor:pointer;border-radius:8px 8px 0 0;color:var(--text-muted);font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;transition:all 0.2s;}
    .tab:hover{background:var(--surface2);color:var(--text);}
    .tab.active{background:var(--bg);color:var(--text);border-top:2px solid var(--blue);}
    .tab .badge{background:var(--surface2);color:var(--text-muted);border-radius:12px;padding:2px 8px;font-size:11px;}
    .tab.active .badge{background:var(--blue);color:#fff;}
    .quarter{display:none;padding:32px 40px;}
    .quarter.active{display:block;}
    .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px;}
    .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
    .kpi-card .label{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .kpi-card .value{font-size:32px;font-weight:700;}
    .kpi-card.green .value{color:var(--green);}
    .kpi-card.blue .value{color:var(--blue);}
    .kpi-card.yellow .value{color:var(--yellow);}
    .kpi-card.red .value{color:var(--red);}
    .block-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:none;font-weight:500;margin-top:8px;}
    .block-btn.danger{background:rgba(239,68,68,0.15);color:var(--red);}
    .block-btn.safe{background:rgba(34,197,94,0.15);color:var(--green);}
    .status-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;}
    .bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--text-muted);}
    .pct{font-size:20px;font-weight:700;color:var(--green);}
    .progress-bar{height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--surface2);}
    .progress-bar .seg{height:100%;}
    .bar-legend{display:flex;gap:20px;margin-top:10px;font-size:11px;color:var(--text-muted);}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
    .scorecards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
    .scorecard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
    .scorecard h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:16px;}
    .scorecard .big-pct{font-size:36px;font-weight:700;color:var(--green);margin-bottom:8px;}
    .sc-bar{height:8px;border-radius:4px;overflow:hidden;background:var(--surface2);display:flex;margin-bottom:12px;}
    .sc-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text-muted);}
    .dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
    .dist-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
    .dist-card h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:16px;}
    .brand-table{width:100%;border-collapse:collapse;}
    .brand-table th{text-align:left;padding:8px 10px;font-size:11px;color:var(--text-muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
    .brand-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;}
    .brand-table tr.brand-row:hover{background:var(--surface2);cursor:pointer;}
    .brand-table tr.sub-row td{font-size:11px;color:var(--text-muted);padding:6px 10px 6px 24px;}
    .num{text-align:right;}.done-num{color:var(--green);}.prog-num{color:var(--blue);}.plan-num{color:var(--yellow);}.blok-num{color:var(--red);}
    .devtype-bars{display:flex;flex-direction:column;gap:8px;}
    .devtype-row{display:flex;align-items:center;gap:8px;}
    .devtype-label{width:120px;font-size:12px;color:var(--text-muted);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .devtype-bar-wrap{flex:1;background:var(--surface2);border-radius:4px;height:20px;overflow:hidden;}
    .devtype-bar{height:100%;background:linear-gradient(90deg,#3b82f6,#818cf8);border-radius:4px;}
    .devtype-count{width:36px;font-size:12px;color:var(--text-muted);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:90%;max-width:900px;max-height:80vh;overflow-y:auto;}
    .modal h2{font-size:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
    .close-btn{cursor:pointer;background:none;border:none;color:var(--text-muted);font-size:20px;}
    .drill-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1001;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px;}
    .drill-overlay.open{display:flex;}
    .drill-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:1100px;}
    .drill-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .drill-kpi{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
    .drill-kpi-card{background:var(--surface2);border-radius:8px;padding:12px 16px;text-align:center;min-width:90px;}
    .dk-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
    .dk-val{font-size:22px;font-weight:700;margin-top:2px;}
    .platform-pills{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .platform-pill{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;}
    .p-name{font-weight:600;font-size:13px;margin-bottom:4px;}
    .p-stats{color:var(--text-muted);}
    .drill-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .drill-filters input,.drill-filters select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-size:12px;}
    .drill-filters input{flex:1;min-width:200px;}
    .issue-table{width:100%;border-collapse:collapse;}
    .issue-table th{text-align:left;padding:8px 10px;font-size:11px;color:var(--text-muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
    .issue-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px;vertical-align:top;}
    .issue-table a{color:var(--blue);text-decoration:none;font-weight:600;font-size:11px;white-space:nowrap;}
    .issue-table a:hover{text-decoration:underline;}
    .date-missing{color:var(--text-muted);font-style:italic;}
    .date-set{color:var(--red);font-weight:700;}
    .date-set-drill{color:var(--text);font-weight:700;}
    .badge-status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
    .badge-done{background:rgba(34,197,94,0.15);color:var(--green);}
    .badge-prog{background:rgba(59,130,246,0.15);color:var(--blue);}
    .badge-plan{background:rgba(245,158,11,0.15);color:var(--yellow);}
    .badge-blok{background:rgba(239,68,68,0.15);color:var(--red);}
    .footer{padding:24px 40px;color:var(--text-muted);font-size:11px;border-top:1px solid var(--border);text-align:center;}
  </style>
</head>

  <script>
    const DATA=JSON.parse(document.getElementById('ewt-data').textContent);
    const QS=['Q1','Q2','Q3','Q4'];
    const today=new Date();
    document.getElementById('header-meta').textContent=`📅 2026 · Q1–Q4 · 🏗 Proje: EWT · 🗓 Oluşturulma: ${today.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'})}`;
    document.getElementById('footer').textContent=`EWT 2026 Quarterly Report — Otomatik oluşturuldu: ${today.toLocaleString('tr-TR')}`;
    function p(a,b){return b?Math.round(a/b*100):0;}
    function sgB(sg){const m={'Tamamlandı':'done','Devam Ediyor':'prog','Planlandı':'plan','Bloklı':'blok'};return `<span class="badge-status badge-${m[sg]||'plan'}">${sg}</span>`;}

    (function buildTabs(){
      const t=document.getElementById('tabs');
      QS.forEach((q,i)=>{
        const d=DATA[q],total=d?d.total:0;
        const el=document.createElement('div');el.className='tab'+(i===0?' active':'');el.id='tab-'+q;
        el.innerHTML=`${q} <span class="badge">${total}</span>`;el.onclick=()=>switchTab(q);t.appendChild(el);
      });
    })();

    function switchTab(q){QS.forEach(x=>{document.getElementById('tab-'+x)?.classList.toggle('active',x===q);document.getElementById('q-'+x)?.classList.toggle('active',x===q);});}

    (function buildQs(){
      const c=document.getElementById('quarters-container');
      QS.forEach((q,i)=>{
        const d=DATA[q];if(!d)return;
        const div=document.createElement('div');div.className='quarter'+(i===0?' active':'');div.id='q-'+q;
        div.innerHTML=buildQ(q,d);c.appendChild(div);
      });
    })();

    function buildQ(q,d){
      const blk=d.status['Bloklı']||0,donePct=p(d.status['Tamamlandı']||0,d.total);
      const kpi=`<div class="kpi-grid">
        <div class="kpi-card"><div class="label">Toplam Issue</div><div class="value">${d.total}</div></div>
        <div class="kpi-card green"><div class="label">Tamamlanan</div><div class="value">${d.status['Tamamlandı']||0}</div></div>
        <div class="kpi-card blue"><div class="label">Devam Ediyor</div><div class="value">${d.status['Devam Ediyor']||0}</div></div>
        <div class="kpi-card yellow"><div class="label">Planlandı</div><div class="value">${d.status['Planlandı']||0}</div></div>
        <div class="kpi-card red"><div class="label">Bloklı</div><div class="value">${blk}</div>
          <div>${blk>0?`<button class="block-btn danger" onclick="openBM('${q}')">🔴 ${blk} Bloklı — Tümünü Gör</button>`:`<button class="block-btn safe">✅ Bloklı issue yok</button>`}</div></div>
      </div>`;
      const segs=[['Tamamlandı','#22c55e'],['Devam Ediyor','#3b82f6'],['Planlandı','#64748b'],['Bloklı','#ef4444']]
        .map(([sg,c])=>`<div class="seg" style="width:${p(d.status[sg]||0,d.total)}%;background:${c}"></div>`).join('');
      const sbar=`<div class="status-bar-wrap"><div class="bar-label"><span>Durum Dağılımı</span><span class="pct">${donePct}% tamamlandı</span></div>
        <div class="progress-bar">${segs}</div>
        <div class="bar-legend">
          <span><span class="dot" style="background:#22c55e"></span>Tamamlandı: ${d.status['Tamamlandı']||0}</span>
          <span><span class="dot" style="background:#3b82f6"></span>Devam: ${d.status['Devam Ediyor']||0}</span>
          <span><span class="dot" style="background:#64748b"></span>Planlandı: ${d.status['Planlandı']||0}</span>
          <span><span class="dot" style="background:#ef4444"></span>Bloklı: ${d.status['Bloklı']||0}</span>
        </div></div>`;
      function sc(title,data){
        const pp=p(data.done,data.total);
        const ss=[{v:data.done,c:'#22c55e'},{v:data.prog,c:'#3b82f6'},{v:data.plan,c:'#64748b'},{v:data.blok,c:'#ef4444'}]
          .map(x=>`<div class="seg" style="width:${p(x.v,data.total)}%;background:${x.c}"></div>`).join('');
        return `<div class="scorecard"><h3>${title}</h3><div class="big-pct">${pp}%</div>
          <div class="sc-bar">${ss}</div>
          <div class="sc-legend">
            <span><span class="dot" style="background:#22c55e"></span>Tamamlandı: ${data.done}</span>
            <span><span class="dot" style="background:#3b82f6"></span>Devam: ${data.prog}</span>
            <span><span class="dot" style="background:#64748b"></span>Planlandı: ${data.plan}</span>
            <span><span class="dot" style="background:#ef4444"></span>Bloklı: ${data.blok}</span>
          </div></div>`;
      }
      const EX=new Set(['Task','Tasarım','Epic','Support','Bug']);
      const brows=Object.entries(d.brands).filter(([b])=>!EX.has(b)).map(([brand,bd])=>{
        let sub='';
        if(bd.sub&&Object.keys(bd.sub).length>0)sub=Object.entries(bd.sub).map(([pl,sd])=>`<tr class="sub-row"><td>↳ ${pl}</td><td class="num">${sd.total}</td><td class="num done-num">${sd.done}</td><td class="num prog-num">${sd.prog}</td><td class="num plan-num">${sd.plan}</td><td class="num blok-num">${sd.blok||0}</td></tr>`).join('');
        return `<tr class="brand-row" onclick="openDrill('${q}','${brand.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"><td>${brand}</td><td class="num">${bd.total}</td><td class="num done-num">${bd.done}</td><td class="num prog-num">${bd.prog}</td><td class="num plan-num">${bd.plan}</td><td class="num blok-num">${bd.blok||0}</td></tr>${sub}`;
      }).join('');
      const mx=Math.max(...Object.values(d.dev_types||{}).map(Number),1);
      const dbars=Object.entries(d.dev_types||{}).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,c])=>`<div class="devtype-row"><div class="devtype-label" title="${t}">${t}</div><div class="devtype-bar-wrap"><div class="devtype-bar" style="width:${Math.round(c/mx*100)}%"></div></div><div class="devtype-count">${c}</div></div>`).join('');
      return kpi+sbar+`<div class="scorecards">${sc('🗺 Roadmap',d.roadmap)}${sc('📋 On-demand',d.ondemand)}</div>`+
        `<div class="dist-grid"><div class="dist-card"><h3>Marka Dağılımı</h3><table class="brand-table"><thead><tr><th>Marka</th><th class="num">Toplam</th><th class="num">Tamam</th><th class="num">Devam</th><th class="num">Plan</th><th class="num">Blok</th></tr></thead><tbody>${brows}</tbody></table></div>
        <div class="dist-card"><h3>Geliştirme Tipi</h3><div class="devtype-bars">${dbars||'<div style="color:var(--text-muted)">Veri yok</div>'}</div></div></div>`;
    }

    function openBM(q){
      const d=DATA[q];
      document.getElementById('block-modal-title').textContent=`${q} — Bloklı Issue'lar (${d.blocked_all.length})`;
      const rows=d.blocked_all.map(i=>`<tr><td><a href="${i.u}" target="_blank">${i.k}</a></td><td>${i.s}</td><td>${i.b}</td><td>${i.c}</td><td>${i.live==='Girilmemiş'?'<span class="date-missing">Girilmemiş</span>':'<span class="date-set">'+i.live+'</span>'}</td></tr>`).join('');
      document.getElementById('block-modal-content').innerHTML=`<table class="issue-table"><thead><tr><th>Key</th><th>Özet</th><th>Marka</th><th>Kategori</th><th>Canlı Hedef</th></tr></thead><tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Bloklı issue yok</td></tr>'}</tbody></table>`;
      document.getElementById('block-modal').classList.add('open');
    }
    function closeBlockModal(){document.getElementById('block-modal').classList.remove('open');}

    function openDrill(q,brand){
      const d=DATA[q],bd=d.brands[brand];if(!bd)return;
      document.getElementById('drill-title').textContent=`${brand} — ${q}`;
      const kc=[{l:'Toplam',v:bd.total,c:'var(--text)'},{l:'Tamamlandı',v:bd.done,c:'var(--green)'},{l:'Devam Ediyor',v:bd.prog,c:'var(--blue)'},{l:'Planlandı',v:bd.plan,c:'var(--yellow)'},{l:'Bloklı',v:bd.blok||0,c:'var(--red)'}].map(x=>`<div class="drill-kpi-card"><div class="dk-label">${x.l}</div><div class="dk-val" style="color:${x.c}">${x.v}</div></div>`).join('');
      let pp='';
      if(bd.sub&&Object.keys(bd.sub).length>0)pp='<div class="platform-pills">'+Object.entries(bd.sub).map(([pl,sd])=>`<div class="platform-pill"><div class="p-name">${pl}</div><div class="p-stats">Toplam: ${sd.total} · ${p(sd.done,sd.total)}% tamamlandı · Done: ${sd.done} · Devam: ${sd.prog} · Bloklı: ${sd.blok||0}</div></div>`).join('')+'</div>';
      const uid=(q+'_'+brand).replace(/[^a-zA-Z0-9]/g,'_');
      const rows=(bd.issues||[]).map(i=>`<tr data-s="${(i.s||'').toLowerCase().replace(/"/g,'').replace(/'/g,'')}" data-c="${i.c}" data-sg="${i.sg}"><td><a href="${i.u}" target="_blank">${i.k}</a></td><td>${i.s}</td><td>${i.c}</td><td>${i.d||'—'}</td><td>${i.live==='Girilmemiş'?'<span class="date-missing">Girilmemiş</span>':'<span class="date-set-drill">'+i.live+'</span>'}</td><td>${sgB(i.sg)}</td></tr>`).join('');
      document.getElementById('drill-content').innerHTML=`<div class="drill-kpi">${kc}</div>${pp}<div class="drill-filters"><input type="text" placeholder="Ara..." oninput="fD('${uid}')" id="ds-${uid}"><select onchange="fD('${uid}')" id="dc-${uid}"><option value="">Tüm Kategoriler</option><option>Roadmap</option><option>On-demand</option><option>Etiketsiz</option></select><select onchange="fD('${uid}')" id="dsg-${uid}"><option value="">Tüm Durumlar</option><option>Tamamlandı</option><option>Devam Ediyor</option><option>Planlandı</option><option>Bloklı</option></select></div><table class="issue-table"><thead><tr><th>Key</th><th>Özet</th><th>Kategori</th><th>Geliştirme Tipi</th><th>Canlı Hedef</th><th>Durum</th></tr></thead><tbody id="dt-${uid}">${rows}</tbody></table>`;
      document.getElementById('drill-overlay').classList.add('open');
    }
    function fD(uid){
      const s=document.getElementById('ds-'+uid)?.value.toLowerCase()||'';
      const c=document.getElementById('dc-'+uid)?.value||'';
      const sg=document.getElementById('dsg-'+uid)?.value||'';
      document.getElementById('dt-'+uid)?.querySelectorAll('tr').forEach(r=>{r.style.display=(!s||r.dataset.s?.includes(s))&&(!c||r.dataset.c===c)&&(!sg||r.dataset.sg===sg)?'':'none';});
    }
    function closeDrill(){document.getElementById('drill-overlay').classList.remove('open');}
    document.getElementById('block-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeBlockModal();});
    document.getElementById('drill-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDrill();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeBlockModal();closeDrill();}});
  </script>
</body>
</html>
