<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWT — 2026 Quarterly Report</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--border:#e2e6ea;--text:#1a1d23;--muted:#6b7280;
  --accent:#2563eb;--accent-light:#eff6ff;
  --green:#16a34a;--green-light:#f0fdf4;
  --yellow:#d97706;--yellow-light:#fffbeb;
  --red:#dc2626;--red-light:#fef2f2;
  --blue:#0ea5e9;--blue-light:#f0f9ff;
  --purple:#7c3aed;--purple-light:#faf5ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

/* HEADER */
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:28px 40px 22px;}
.header h1{font-size:24px;font-weight:700;letter-spacing:-.3px;}
.header .subtitle{font-size:13px;opacity:.75;margin-top:3px;}
.header-meta{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;}
.header-meta span{font-size:12px;opacity:.8;}

/* TABS */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 32px;overflow-x:auto;}
.tab{padding:14px 22px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab .tbadge{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f3f5;color:var(--muted);}
.tab.active .tbadge{background:var(--accent-light);color:var(--accent);}
.tab .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;}

/* CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:22px 20px 60px;}
.quarter-panel{display:none;}.quarter-panel.active{display:block;}

/* SECTION */
.section{margin-bottom:26px;}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:11px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;}
.kpi-label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-1px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.kpi-card.green .kpi-value{color:var(--green);}
.kpi-card.blue  .kpi-value{color:var(--blue);}
.kpi-card.yellow .kpi-value{color:var(--yellow);}
.kpi-card.red   .kpi-value{color:var(--red);}
.kpi-card.total .kpi-value{color:var(--text);}

/* BLOCKED BUTTON */
.block-btn{display:inline-flex;align-items:center;gap:6px;background:var(--red-light);color:var(--red);border:1.5px solid #fca5a5;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s;}
.block-btn:hover{background:#fee2e2;}
.block-btn.zero{background:#f0fdf4;color:var(--green);border-color:#86efac;cursor:default;}

/* STACKED BAR */
.status-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stacked-bar{height:26px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:10px;}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:width .6s;}
.seg span{white-space:nowrap;overflow:hidden;}
.seg.done{background:var(--green);}
.seg.prog{background:var(--blue);}
.seg.plan{background:#94a3b8;}
.seg.blok{background:var(--red);}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.leg-dot{width:9px;height:9px;border-radius:3px;}

/* 2-COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* SCORECARD */
.scorecard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.sc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.sc-title{font-size:14px;font-weight:700;}
.sc-pct{font-size:20px;font-weight:800;}
.sc-pct.g{color:var(--green)}.sc-pct.b{color:var(--blue)}.sc-pct.m{color:var(--muted);}
.prog-bar{height:8px;background:#e2e6ea;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;}
.prog-fill.g{background:var(--green)}.prog-fill.b{background:var(--blue);}
.sc-leg{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;}
.sc-leg span{font-size:11px;color:var(--muted);}
.sc-leg b{color:var(--text);}

/* TABLE CARD */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.table-hdr{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 14px;background:#f8f9fb;text-align:left;border-bottom:1px solid var(--border);}
td{padding:9px 14px;border-bottom:1px solid #f1f3f5;font-size:13px;}
tr:last-child td{border-bottom:none;}

/* BRAND TABLE rows */
.brand-row{cursor:pointer;transition:background .1s;}
.brand-row:hover td{background:#f0f7ff;}
.sub-row td{background:#fafbfc;padding-left:28px;font-size:12px;color:var(--muted);}
.sub-row:hover td{background:#f0f7ff;}

/* BAR CHART */
.bar-chart{padding:13px 16px;}
.bar-row{display:flex;align-items:center;margin-bottom:7px;gap:8px;}
.bar-label{width:175px;flex-shrink:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:16px;background:#f1f3f5;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:5px;}
.bar-fill span{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}
.bar-count{width:26px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);}

/* RISK */
.risk-list{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.risk-item{padding:11px 16px;border-bottom:1px solid #f1f3f5;display:flex;align-items:flex-start;gap:11px;}
.risk-item:last-child{border-bottom:none;}
.risk-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;background:var(--red-light);}
.risk-key{font-size:11px;font-weight:700;color:var(--muted);}
.risk-s{font-size:13px;font-weight:500;margin:1px 0;}
.risk-meta{font-size:11px;color:var(--muted);}
.risk-link{color:var(--accent);text-decoration:none;font-size:11px;font-weight:600;margin-left:6px;}
.risk-link:hover{text-decoration:underline;}
.empty-state{padding:18px;text-align:center;color:var(--muted);font-size:13px;}

/* DRILL-DOWN */
.drill-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;overflow-y:auto;padding:40px 20px;}
.drill-overlay.open{display:flex;align-items:flex-start;justify-content:center;}
.drill-box{background:#fff;border-radius:16px;width:100%;max-width:860px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.drill-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.drill-title{font-size:16px;font-weight:700;}
.drill-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);padding:4px 8px;border-radius:6px;}
.drill-close:hover{background:#f3f4f6;}
.drill-kpis{display:flex;gap:0;border-bottom:1px solid var(--border);}
.drill-kpi{flex:1;padding:14px 18px;border-right:1px solid var(--border);text-align:center;}
.drill-kpi:last-child{border-right:none;}
.drill-kpi-val{font-size:22px;font-weight:800;}
.drill-kpi-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.drill-sub-section{padding:14px 22px 4px;border-bottom:1px solid var(--border);}
.drill-sub-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.sub-pills{display:flex;gap:10px;flex-wrap:wrap;}
.sub-pill{background:#f8f9fb;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;}
.sub-pill-name{font-weight:700;color:var(--text);}
.sub-pill-stats{color:var(--muted);margin-top:2px;font-size:11px;}
.drill-filter{padding:12px 22px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.drill-filter select,.drill-filter input{font-size:13px;padding:5px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none;}
.drill-filter input{flex:1;min-width:180px;}
.drill-count{padding:6px 22px 0;font-size:12px;color:var(--muted);}
.drill-table-wrap{max-height:420px;overflow-y:auto;}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;}
.pill.done{background:var(--green-light);color:var(--green);}
.pill.prog{background:var(--blue-light);color:var(--blue);}
.pill.plan{background:#f3f4f6;color:#6b7280;}
.pill.blok{background:var(--red-light);color:var(--red);}

/* BLOCK MODAL */
.block-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto;padding:40px 20px;}
.block-modal.open{display:flex;align-items:flex-start;justify-content:center;}
.block-box{background:#fff;border-radius:16px;width:100%;max-width:760px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.block-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.block-hdr-title{font-size:15px;font-weight:700;color:var(--red);}

/* FOOTER */
.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px;border-top:1px solid var(--border);margin-top:36px;}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .header{padding:16px;}
  .tab-bar{padding:0 10px;}
}
</style>
</head>

 "Brooks", "st": "Block", "c": "Roadmap", "live": "8 Eki 2026"}, {"k": "EWT-3428", "u": "https://olkaproduct.atlassian.net/browse/EWT-3428", "s": "Randevulu iade yöntemi - Steve Madden", "b": "Steve Madden", "st": "Block", "c": "Roadmap", "live": "Girilmemiş"}, {"k": "EWT-3385", "u": "https://olkaproduct.atlassian.net/browse/EWT-3385", "s": "Operasyon raporlarının space'e aktarılması - Steve Madden", "b": "Steve Madden", "st": "Block", "c": "Roadmap", "live": "Girilmemiş"}, {"k": "EWT-3354", "u": "https://olkaproduct.atlassian.net/browse/EWT-3354", "s": "AI generated ürün içeriklerinin pim'e alınması - Steve Madden", "b": "Steve Madden", "st": "Block", "c": "Roadmap", "live": "Girilmemiş"}, {"k": "EWT-3279", "u": "https://olkaproduct.atlassian.net/browse/EWT-3279", "s": "AI Semantic Search Entegrasyonu - Klaud", "b": "Klaud", "st": "Block", "c": "Roadmap", "live": "30 Eki 2026"}, {"k": "EWT-3260", "u": "https://olkaproduct.atlassian.net/browse/EWT-3260", "s": "Çoklu fased yönetimi", "b": "High5", "st": "Block", "c": "Roadmap", "live": "Girilmemiş"}, {"k": "EWT-3248", "u": "https://olkaproduct.atlassian.net/browse/EWT-3248", "s": "Hub'da yönetilecek personel indirimi ve istihkak yönetimi", "b": "Brooks", "st": "Block", "c": "Roadmap", "live": "Girilmemiş"}, {"k": "EWT-3116", "u": "https://olkaproduct.atlassian.net/browse/EWT-3116", "s": "Wishlist Event Trigger Logic Fix", "b": "Skechers", "st": "Block", "c": "Roadmap", "live": "31 Ağu 2026"}]}}</script>
<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const DATA_JSON = document.getElementById('ewt-data').textContent;
const DATA = JSON.parse(DATA_JSON);

const BRAND_COLORS = {
  Skechers:"#f59e0b",High5:"#6366f1",iOS:"#0ea5e9",Android:"#22c55e",
  Klaud:"#8b5cf6",Brooks:"#ef4444",Hunter:"#10b981",
  "Steve Madden":"#1d4ed8",Asics:"#f97316",Marlin:"#0d9488",
  "On Shoes":"#06b6d4","Hunter ":"#10b981"
};
const DEV_COLORS = {
  "Belirtilmemiş":"#94a3b8",
  "Varolan yetkinlik, marka için implamentasyon":"#3b82f6",
  "Bug":"#ef4444",
  "Arayüz tasarımı değişikliği":"#f59e0b",
  "Yeni yetkinlik":"#10b981",
  "Konfigürasyon":"#8b5cf6",
  "Varolan yetkinlik, marka için özelleştirilmiş implamentasyon":"#6366f1",
  "Teknik Analiz":"#0ea5e9",
  "Yeni arayüz tasarımı":"#ec4899"
};
const Q_META = {
  Q1:{label:"Q1 · Oca–Mar",color:"#16a34a",dot:"#16a34a"},
  Q2:{label:"Q2 · Nis–Haz",color:"#2563eb",dot:"#2563eb"},
  Q3:{label:"Q3 · Tem–Eyl",color:"#d97706",dot:"#d97706"},
  Q4:{label:"Q4 · Eki–Ara",color:"#7c3aed",dot:"#7c3aed"},
};
const SG_CLASS = {"Tamamlandı":"done","Devam Ediyor":"prog","Planlandı":"plan","Bloklı":"blok"};

let currentDrillIssues = [];

function pct(a,b){return b===0?0:Math.round(a/b*100);}

// ── TABS ─────────────────────────────────────────────────────────────────────
document.getElementById('report-date').textContent = new Date().toLocaleDateString('tr-TR');
const tabBar = document.getElementById('tab-bar');
['Q1','Q2','Q3','Q4'].forEach((q,i) => {
  const d = DATA[q]; const m = Q_META[q];
  const tab = document.createElement('div');
  tab.className = 'tab'+(i===2?' active':'');
  tab.dataset.q = q;
  tab.innerHTML = `<span class="tdot" style="background:${m.dot}"></span>${m.label}<span class="tbadge">${d.total}</span>`;
  tab.onclick = () => switchTab(q);
  tabBar.appendChild(tab);
});

function switchTab(q) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.q===q));
  document.querySelectorAll('.quarter-panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+q));
}

// ── BUILD PANELS ─────────────────────────────────────────────────────────────
const container = document.getElementById('panels-container');
['Q1','Q2','Q3','Q4'].forEach((q,i) => {
  const panel = document.createElement('div');
  panel.className = 'quarter-panel'+(i===2?' active':'');
  panel.id = 'panel-'+q;
  panel.innerHTML = buildPanel(q);
  container.appendChild(panel);
});

function buildPanel(q) {
  const d = DATA[q]; const m = Q_META[q];
  const done = d.status['Tamamlandı']||0;
  const prog = d.status['Devam Ediyor']||0;
  const plan = d.status['Planlandı']||0;
  const blok = d.status['Bloklı']||0;
  const total = d.total;

  // KPI
  const blockBtnCls = blok>0 ? 'block-btn' : 'block-btn zero';
  const blockBtnTxt = blok>0
    ? `🔴 ${blok} Bloklı Issue — Tümünü Gör`
    : `✅ Bloklı issue yok`;
  const blockBtnOnclick = blok>0 ? `openBlockModal('${q}')` : '';

  // Stacked bar
  const segs = [{cls:'done',v:done},{cls:'prog',v:prog},{cls:'plan',v:plan},{cls:'blok',v:blok}].filter(s=>s.v>0);
  const stackedBar = segs.map(s=>{
    const w=pct(s.v,total);
    return `<div class="seg ${s.cls}" style="width:${w}%"><span>${w>=8?s.v:''}</span></div>`;
  }).join('');
  const legColors={done:'var(--green)',prog:'var(--blue)',plan:'#94a3b8',blok:'var(--red)'};
  const legLabels={done:'Tamamlandı',prog:'Devam Ediyor',plan:'Planlandı',blok:'Bloklı'};
  const legend = segs.map(s=>`<div class="leg-item"><div class="leg-dot" style="background:${legColors[s.cls]}"></div>${s.v} ${legLabels[s.cls]}</div>`).join('');

  // Scorecards
  const rm=d.roadmap, od=d.ondemand;
  const rmP=pct(rm.done,rm.total), odP=pct(od.done,od.total);

  // Brand table
  const brandRows = Object.entries(d.brands).map(([name,bd]) => {
    const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${BRAND_COLORS[name]||'#94a3b8'};margin-right:6px;"></span>`;
    const hasSub = bd.sub && Object.keys(bd.sub).length>0;
    const mainRow = `<tr class="brand-row" onclick="openDrill('${q}','${name.replace(/'/g,"\\'")}')">
      <td>${dot}<strong>${name}</strong>${hasSub?'<span style="font-size:10px;color:var(--muted);margin-left:4px;">(+alt kırılım)</span>':''}</td>
      <td><strong>${bd.total}</strong></td>
      <td style="color:var(--green);font-weight:600">${bd.done}</td>
      <td style="color:var(--blue);font-weight:600">${bd.prog||0}</td>
      <td style="color:var(--muted)">${bd.plan||0}</td>
      <td style="color:${bd.blok>0?'var(--red)':'var(--muted)'}${bd.blok>0?';font-weight:700':''}">${bd.blok||0}</td>
    </tr>`;
    let subRows = '';
    if (hasSub) {
      subRows = Object.entries(bd.sub).map(([sname,sv])=>`
        <tr class="sub-row">
          <td>↳ ${sname}</td>
          <td>${sv.total}</td>
          <td style="color:var(--green)">${sv.done}</td>
          <td style="color:var(--blue)">${sv.prog||0}</td>
          <td>${sv.plan||0}</td>
          <td style="color:${sv.blok>0?'var(--red)':'var(--muted)'}">${sv.blok||0}</td>
        </tr>`).join('');
    }
    return mainRow + subRows;
  }).join('');

  // Dev type bars
  const maxDT = Math.max(...Object.values(d.dev_types).filter(v=>v>0), 1);
  const dtBars = Object.entries(d.dev_types).map(([name,cnt])=>{
    const w=pct(cnt,maxDT);
    const short=name.length>34?name.slice(0,32)+'…':name;
    const color=DEV_COLORS[name]||'#94a3b8';
    return `<div class="bar-row">
      <div class="bar-label" title="${name}">${short}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"><span>${cnt>=3?cnt:''}</span></div></div>
      <div class="bar-count">${cnt<3?cnt:''}</div>
    </div>`;
  }).join('');

  return `
  <div class="section">
    <div class="kpi-grid">
      <div class="kpi-card total"><div class="kpi-label">Toplam Issue</div><div class="kpi-value">${total}</div><div class="kpi-sub">Q${q.slice(1)} kapsamı</div></div>
      <div class="kpi-card green"><div class="kpi-label">Tamamlanan</div><div class="kpi-value">${done}</div><div class="kpi-sub">Done + ONLIVE</div></div>
      <div class="kpi-card blue"><div class="kpi-label">Devam Ediyor</div><div class="kpi-value">${prog}</div><div class="kpi-sub">Dev + UAT</div></div>
      <div class="kpi-card yellow"><div class="kpi-label">Planlandı</div><div class="kpi-value">${plan}</div><div class="kpi-sub">Plan + To Do</div></div>
      <div class="kpi-card red"><div class="kpi-label">Bloklı</div><div class="kpi-value">${blok}</div>
        <div><button class="${blockBtnCls}" onclick="${blockBtnOnclick}">${blockBtnTxt}</button></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="status-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;">
        <div style="font-size:14px;font-weight:700;">📊 Genel Durum — ${total} Issue</div>
        <div style="font-size:18px;font-weight:800;color:${m.color}">${pct(done,total)}% tamamlandı</div>
      </div>
      <div class="stacked-bar">${stackedBar}</div>
      <div class="bar-legend">${legend}</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Kategori Tamamlanma Oranları</div>
    <div class="two-col">
      <div class="scorecard">
        <div class="sc-hdr">
          <div class="sc-title">🗺 Roadmap <span style="font-weight:400;color:var(--muted);font-size:12px">(${rm.total})</span></div>
          <div class="sc-pct ${rmP>=70?'g':rmP>=30?'b':'m'}">${rmP}%</div>
        </div>
        <div class="prog-bar"><div class="prog-fill ${rmP>=70?'g':'b'}" style="width:${rmP}%"></div></div>
        <div class="sc-leg">
          <span>✅ <b>${rm.done}</b> Tamamlandı</span>
          <span>🔄 <b>${rm.prog}</b> Devam</span>
          <span>📋 <b>${rm.plan}</b> Planlandı</span>
          ${rm.blok>0?`<span style="color:var(--red)">🔴 <b>${rm.blok}</b> Bloklı</span>`:''}
        </div>
      </div>
      <div class="scorecard">
        <div class="sc-hdr">
          <div class="sc-title">⚡ On-demand <span style="font-weight:400;color:var(--muted);font-size:12px">(${od.total})</span></div>
          <div class="sc-pct ${odP>=70?'g':odP>=30?'b':'m'}">${od.total===0?'—':odP+'%'}</div>
        </div>
        <div class="prog-bar"><div class="prog-fill ${odP>=70?'g':'b'}" style="width:${odP}%"></div></div>
        <div class="sc-leg">
          <span>✅ <b>${od.done}</b> Tamamlandı</span>
          <span>🔄 <b>${od.prog}</b> Devam</span>
          <span>📋 <b>${od.plan}</b> Planlandı</span>
          ${od.blok>0?`<span style="color:var(--red)">🔴 <b>${od.blok}</b> Bloklı</span>`:''}
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Dağılım Analizi</div>
    <div class="two-col">
      <div class="table-card">
        <div class="table-hdr">🏷 Marka / Platform <span style="font-size:11px;color:var(--muted);font-weight:400">Tıkla → detay</span></div>
        <table><thead><tr><th>Marka</th><th>Toplam</th><th>Tamam</th><th>Devam</th><th>Plan</th><th>Blok</th></tr></thead>
        <tbody>${brandRows}</tbody></table>
      </div>
      <div class="table-card">
        <div class="table-hdr">🔧 Geliştirme Tipi</div>
        <div class="bar-chart">${dtBars}</div>
      </div>
    </div>
  </div>`;
}

// ── BLOCKED MODAL ─────────────────────────────────────────────────────────────
function openBlockModal(q) {
  const d = DATA[q];
  const items = d.blocked_all || [];
  document.getElementById('block-modal-title').textContent = `🔴 ${q} Bloklı Issue'lar (${items.length})`;
  const body = document.getElementById('block-modal-body');
  if (items.length === 0) {
    body.innerHTML = '<div class="empty-state">Bloklı issue bulunamadı.</div>';
  } else {
    body.innerHTML = `<div style="overflow-y:auto;max-height:500px;">
      <table><thead><tr><th>Key</th><th>Özet</th><th>Marka</th><th>Kategori</th><th>Canlı Hedef</th></tr></thead><tbody>
      ${items.map(r=>{
        const lv = r.live||'Girilmemiş';
        const ls = lv==='Girilmemiş'?'color:var(--muted);font-style:italic':'color:var(--red);font-weight:700';
        return `<tr>
        <td><a href="${r.u}" target="_blank" style="color:var(--accent);font-weight:700;text-decoration:none">${r.k}</a></td>
        <td style="max-width:260px">${r.s}</td>
        <td><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${BRAND_COLORS[r.b]||'#94a3b8'};margin-right:5px;"></span>${r.b}</td>
        <td>${r.c}</td>
        <td style="font-size:12px;white-space:nowrap;${ls}">${lv}</td>
      </tr>`;}).join('')}
      </tbody></table>
    </div>`;
  }
  document.getElementById('block-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeBlockModal(e) {
  if (!e || e.target===document.getElementById('block-modal')) {
    document.getElementById('block-modal').classList.remove('open');
    document.body.style.overflow='';
  }
}

// ── BRAND DRILL-DOWN ─────────────────────────────────────────────────────────
function openDrill(q, brandName) {
  const bd = DATA[q].brands[brandName];
  if (!bd) return;

  // Title
  const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${BRAND_COLORS[brandName]||'#94a3b8'};margin-right:8px;"></span>`;
  document.getElementById('drill-title').innerHTML = `${dot}${brandName} — ${q}`;

  // KPIs
  document.getElementById('drill-kpis').innerHTML = [
    {v:bd.total,l:'Toplam',c:'var(--text)'},
    {v:bd.done,l:'Tamamlandı',c:'var(--green)'},
    {v:bd.prog||0,l:'Devam Ediyor',c:'var(--blue)'},
    {v:bd.plan||0,l:'Planlandı',c:'var(--muted)'},
    {v:bd.blok||0,l:'Bloklı',c:'var(--red)'},
  ].map(k=>`<div class="drill-kpi"><div class="drill-kpi-val" style="color:${k.c}">${k.v}</div><div class="drill-kpi-lbl">${k.l}</div></div>`).join('');

  // Sub-brands (iOS/Android for Skechers)
  const subWrap = document.getElementById('drill-sub-wrap');
  if (bd.sub && Object.keys(bd.sub).length > 0) {
    const pills = Object.entries(bd.sub).map(([sname,sv])=>{
      const sp = pct(sv.done,sv.total);
      return `<div class="sub-pill">
        <div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${BRAND_COLORS[sname]||'#94a3b8'};margin-right:5px;"></span><span class="sub-pill-name">${sname}</span></div>
        <div class="sub-pill-stats">${sv.total} issue · ${sp}% tamam · ${sv.done} Done · ${sv.prog||0} Devam${sv.blok>0?` · <span style="color:var(--red)">${sv.blok} Bloklı</span>`:''}</div>
      </div>`;
    }).join('');
    subWrap.innerHTML = `<div class="drill-sub-section"><div class="drill-sub-title">Alt Kırılım (Platform)</div><div class="sub-pills">${pills}</div></div>`;
  } else {
    subWrap.innerHTML = '';
  }

  // Store issues for filtering
  currentDrillIssues = bd.issues || [];
  document.getElementById('drill-search').value = '';
  document.getElementById('drill-filter-cat').value = '';
  document.getElementById('drill-filter-sg').value = '';
  renderDrillTable();

  document.getElementById('drill-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderDrillTable() {
  const q = document.getElementById('drill-search').value.toLowerCase();
  const cat = document.getElementById('drill-filter-cat').value;
  const sg = document.getElementById('drill-filter-sg').value;
  const filtered = currentDrillIssues.filter(r =>
    (!q || r.s.toLowerCase().includes(q) || r.k.toLowerCase().includes(q)) &&
    (!cat || r.c === cat) &&
    (!sg || r.sg === sg)
  );
  document.getElementById('drill-count').textContent = `${filtered.length} issue gösteriliyor`;
  const tbody = document.getElementById('drill-tbody');
  tbody.innerHTML = filtered.map(r => {
    const sgcls = SG_CLASS[r.sg]||'plan';
    const subLabel = r.sub_brand ? `<span style="font-size:10px;color:var(--muted);margin-left:4px;">[${r.sub_brand}]</span>` : '';
    const liveVal = r.live || 'Girilmemiş';
    const liveStyle = liveVal==='Girilmemiş' ? 'color:var(--muted);font-style:italic' : 'color:var(--text);font-weight:600';
    return `<tr>
      <td><a href="${r.u}" target="_blank" style="color:var(--accent);font-weight:700;text-decoration:none">${r.k}</a></td>
      <td style="max-width:260px;font-size:12px">${r.s}${subLabel}</td>
      <td><span style="font-size:11px;color:var(--muted)">${r.c}</span></td>
      <td style="font-size:11px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.d}">${r.d==='—'?'—':r.d.length>20?r.d.slice(0,18)+'…':r.d}</td>
      <td style="font-size:12px;white-space:nowrap;${liveStyle}">${liveVal}</td>
      <td><span class="pill ${sgcls}">${r.sg}</span></td>
    </tr>`;
  }).join('');
}

function closeDrill(e) {
  if (!e || e.target===document.getElementById('drill-overlay')) {
    document.getElementById('drill-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

// ESC key closes modals
document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    closeDrill(); closeBlockModal();
  }
});
</script>
</body>
</html>
